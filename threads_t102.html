<!DOCTYPE html>
<html lang="ko" class="crit-shell-real" style="--accent: #545e92;"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crit — 타래</title>
<style>
  :root {
    --accent:#B26A9E;
    color-scheme: dark;
    accent-color: var(--accent);
    --bg:     color-mix(in srgb, var(--accent) 5%,  #131216);
    --panel:  color-mix(in srgb, var(--accent) 8%, #1d1b21);
    --panel2: color-mix(in srgb, var(--accent) 10%, #26242c);
    --line:   color-mix(in srgb, var(--accent) 18%, #34313a);
    --text:   color-mix(in srgb, var(--accent) 5%,  #f0edf3);
    --dim:    color-mix(in srgb, var(--accent) 12%, #9a95a0);
    --desc:   color-mix(in srgb, var(--accent) 12%, #d1cdd8);
  }
  body.light {
    color-scheme: light;
    --bg:     color-mix(in srgb, var(--accent) 3%,  #f7f6f8);
    --panel:  color-mix(in srgb, var(--accent) 4%,  #ffffff);
    --panel2: color-mix(in srgb, var(--accent) 5%,  #efedf1);
    --line:   color-mix(in srgb, var(--accent) 13%, #d9d6dd);
    --text:   color-mix(in srgb, var(--accent) 8%, #27242a);
    --dim:    color-mix(in srgb, var(--accent) 9%, #6f6a76);
    --desc:   color-mix(in srgb, var(--accent) 15%, #565060);
  }
  * { box-sizing:border-box; }
  html { scrollbar-width:thin; scrollbar-color: color-mix(in srgb, var(--accent) 45%, var(--line)) transparent; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius:8px; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; line-height:1.65; }
  .wrap { max-width:720px; margin:0 auto; padding:20px 16px 60px; }

  /* 상단 전역 메뉴 */
  .topnav { display:flex; gap:6px; align-items:center; padding:2px 2px 0; margin-bottom:6px; padding-bottom:9px;
    border-bottom:1px solid var(--line); }
  .navid { display:flex; align-items:center; gap:7px; font-size:13.5px; font-weight:800;
    letter-spacing:-.3px; margin-right:10px; padding:2px 2px; }
  .topnav a { padding:5px 14px; border-radius:999px; font-size:12.5px;
    color:var(--dim); text-decoration:none; border:1px solid transparent; transition:.12s; }
  .topnav a:hover { color:var(--text); border-color:var(--line); }
  .topnav .on { background:color-mix(in srgb, var(--accent) 16%, var(--panel2));
    border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line));
    color:var(--text); font-weight:600; }
  .navgear { margin-left:auto; display:flex; padding:6px !important; border-radius:8px !important; }

  .toolbar { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center;
    padding:10px 2px; margin-bottom:14px; border-bottom:1px solid var(--line); }
  .toolbar.home { grid-template-columns:auto 1fr; }
  .toolbar.home .tleft { display:none; }
  .toolbar.home .ttl { text-align:left; }
  .toolbar .ttl { font-size:14px; font-weight:700; text-align:center; white-space:nowrap; }
  .tslot { display:flex; gap:8px; align-items:center; }
  .tleft { justify-content:flex-start; }
  .tright { justify-content:flex-end; flex-wrap:wrap; }
  .toolbar button { background:var(--panel2); color:var(--dim); border:1px solid var(--line);
    border-radius:8px; padding:5px 11px; font-size:12.5px; cursor:pointer; font-family:inherit; }
  .toolbar button:hover { color:var(--text); border-color:var(--accent); }
  .settings { position:relative; }
  .spanel { display:none; position:absolute; right:0; top:36px; z-index:20; width:270px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px;
    box-shadow:0 10px 30px #0008; }
  .spanel.open { display:block; }
  .spanel h4 { margin:0 0 8px; font-size:12.5px; color:var(--dim); font-weight:600; }
  .srow { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; margin-bottom:8px; }
  .srow input[type=color] { width:34px; height:24px; border:none; background:none; padding:0; cursor:pointer; }
  .srow label { display:flex; align-items:center; gap:4px; font-size:12.5px; color:var(--dim); cursor:pointer; }
  .cwrap { display:flex; align-items:center; gap:6px; }
  .hexin { width:74px; background:var(--panel2); border:1px solid var(--line); border-radius:6px;
    color:var(--text); font-size:12px; padding:4px 6px; font-family:Consolas,"D2Coding",monospace; }
  input[type=radio] { appearance:none; -webkit-appearance:none; width:15px; height:15px; flex:none;
    border:1.5px solid var(--line); background:var(--panel2); cursor:pointer;
    margin:0 3px 0 0; vertical-align:-2px; transition:.12s; border-radius:50%; }
  input[type=radio]:checked { background:var(--accent); border-color:var(--accent);
    box-shadow:inset 0 0 0 3px var(--panel); }
  input::placeholder, textarea::placeholder { color:color-mix(in srgb, var(--accent) 30%, var(--dim)); }

  /* 타래 목록 */
  .tcard { background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:14px 17px; margin-bottom:10px; cursor:pointer; transition:.15s; }
  .tcard:hover { border-color:var(--accent); transform:translateY(-1px); }
  /* 타래 드래그 정렬: 드래그 중인 카드 자리에 점선 빈자리가 생겨서, 놓을 위치가 자연스럽게
     비워지는 느낌을 준다 (로그 목록 드래그 정렬과 같은 방식) */
  .tgap { border:2px dashed color-mix(in srgb, var(--accent) 60%, transparent); border-radius:14px;
    margin-bottom:10px; background:color-mix(in srgb, var(--accent) 7%, transparent); }
  .tcard.dragging { display:none; }
  .tghost { position:fixed; z-index:9999; pointer-events:none; opacity:.9; box-shadow:0 10px 30px #0007; margin-bottom:0; }
  .tcard .tt { font-size:14.5px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .tcard .tm { display:flex; gap:8px; align-items:center; margin-top:4px; font-size:11.5px; color:var(--dim); }
  .logchip { border-radius:999px; padding:1px 9px; font-size:10.5px; flex:none;
    background:color-mix(in srgb, var(--accent) 14%, var(--panel2));
    border:1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); color:var(--text); }
  .empty { color:var(--dim); font-size:13px; font-style:italic; text-align:center; padding:40px 0; }

  /* 타래 뷰 (트위터식) */
  .thread { display:none; }
  .thead { display:flex; align-items:center; gap:10px; padding:2px 2px 12px; }
  .thead .tt { font-size:16px; font-weight:800; letter-spacing:-.3px; flex:1; min-width:0; }
  .gologbtn { display:flex; align-items:center; gap:6px; background:color-mix(in srgb, var(--accent) 14%, var(--panel2));
    border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); color:var(--text);
    border-radius:999px; padding:4px 13px; font-size:12px; cursor:pointer; font-family:inherit; flex:none; }
  .gologbtn:hover { border-color:var(--accent); }
  .teditbtn { flex:none; background:var(--panel2); color:var(--dim); border:1px solid var(--line);
    border-radius:8px; padding:4px 12px; font-size:12px; cursor:pointer; font-family:inherit; }
  .teditbtn:hover { color:var(--text); border-color:var(--accent); }
  .posts { border-top:1px solid var(--line); }
  .post { display:flex; gap:11px; padding:13px 6px 12px; position:relative; }
  .post::after { content:""; position:absolute; left:6px; right:6px; bottom:0; border-bottom:1px solid color-mix(in srgb, var(--line) 55%, transparent); }
  .post:not(:last-child)::before { content:""; position:absolute; left:24px; top:48px; bottom:-14px;
    width:2px; background:var(--line); }
  .pav { flex:none; width:38px; height:38px; border-radius:50%; z-index:1;
    background:color-mix(in srgb, var(--accent) 30%, var(--panel2));
    background-size:cover; background-position:center;
    border:1.5px solid color-mix(in srgb, var(--accent) 50%, var(--line)); }
  .pbody { flex:1; min-width:0; }
  .phead { display:flex; align-items:baseline; gap:7px; }
  .pname { font-size:13.5px; font-weight:700; }
  .ptime { font-size:11px; color:var(--dim); }
  .ptxt { font-size:13.5px; color:var(--desc); white-space:pre-wrap; margin-top:2px; overflow-wrap:break-word; }
  /* 게시물 이미지 (트위터식 그리드, 최대 4장) */
  .pimgs { display:grid; gap:3px; border-radius:12px; overflow:hidden; margin-top:8px;
    border:1px solid var(--line); }
  .pimgs[data-n="1"] { grid-template-columns:1fr; }
  .pimgs[data-n="2"] { grid-template-columns:1fr 1fr; }
  .pimgs[data-n="3"] { grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }
  .pimgs[data-n="3"] .pimg:first-child { grid-row:span 2; }
  .pimgs[data-n="4"] { grid-template-columns:1fr 1fr; }
  .pimg { background-size:cover; background-position:center; cursor:pointer; min-height:120px; }
  .pimgs[data-n="1"] .pimg { aspect-ratio:16/9; min-height:0; }
  .pdel { position:absolute; top:12px; right:8px; display:none; width:18px; height:18px;
    border-radius:50%; background:#a84848; color:#fff; border:none; font-size:11px; line-height:1;
    cursor:pointer; align-items:center; justify-content:center; }
  .post:hover .pdel { display:flex; }

  /* 이어쓰기 */
  .composer { display:flex; gap:11px; padding:14px 6px 0; }
  .composer .pav { margin-top:2px; }
  .cbox { flex:1; }
  .cta { width:100%; min-height:64px; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:12px; padding:10px 13px; font-size:13.5px;
    font-family:inherit; resize:none; outline:none; line-height:1.6; }
  .cta:focus { border-color:var(--accent); }
  .cprev { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .cpi { width:58px; height:58px; border-radius:9px; background-size:cover; background-position:center;
    border:1px solid var(--line); position:relative; }
  .cpi button { position:absolute; top:-6px; right:-6px; width:16px; height:16px; border-radius:50%;
    background:#a84848; color:#fff; border:none; font-size:10px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; }
  .crow2 { display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
  .imgaddbtn { display:flex; align-items:center; gap:5px; background:none; color:var(--accent);
    border:1px solid transparent; border-radius:8px; padding:5px 9px; font-size:12px;
    cursor:pointer; font-family:inherit; }
  .imgaddbtn:hover { border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .imgaddbtn:disabled { opacity:.4; cursor:default; }
  .postbtn { background:var(--accent); color:#fff; border:none; border-radius:999px;
    padding:7px 20px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }

  /* 모달 */
  .overlay { position:fixed; inset:0; z-index:60; background:#0008; display:flex; align-items:center; justify-content:center; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; width:340px; }
  .modal h3 { margin:0 0 12px; font-size:15px; }
  .modal p { margin:0 0 14px; font-size:13.5px; }
  .mrow { display:flex; align-items:center; gap:10px; font-size:13px; margin-bottom:10px; }
  .mrow > span:first-child { flex:none; width:64px; color:var(--dim); }
  .mrow input[type=text] { flex:1; background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:6px 9px; font-size:13px; font-family:inherit; outline:none; min-width:0; }
  .mrow input:focus { border-color:var(--accent); }
  .dd { position:relative; flex:1; min-width:0; }
  .ddbtn { width:100%; display:flex; align-items:center; justify-content:space-between; gap:6px;
    background:var(--panel2); border:1px solid var(--line); border-radius:8px; color:var(--dim);
    font-size:12.5px; padding:6px 10px; cursor:pointer; font-family:inherit; transition:.12s; }
  .ddbtn:hover, .dd.open .ddbtn { border-color:var(--accent); color:var(--text); }
  .ddchev { display:flex; transition:.15s; }
  .dd.open .ddchev { transform:rotate(180deg); }
  /* 로그 연결: 버튼+메뉴 대신 검색어를 바로 입력하는 인풋 - 로그가 많아지면 눌러서 스크롤
     하는 것보다 타이핑으로 좁혀 찾는 게 빠르다 */
  .ddinput { width:100%; box-sizing:border-box; background:var(--panel2); border:1px solid var(--line);
    border-radius:8px; color:var(--text); font-size:12.5px; padding:6px 10px; font-family:inherit;
    outline:none; transition:.12s; }
  .ddinput::placeholder { color:var(--dim); }
  .ddinput:focus, .dd.open .ddinput { border-color:var(--accent); }
  .ddmenu { display:none; position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:70;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:5px;
    max-height:220px; overflow-y:auto;
    box-shadow:0 10px 26px rgba(0,0,0,.4); }
  .dd.open .ddmenu { display:block; }
  .ddopt { padding:6px 10px; border-radius:7px; font-size:12.5px; color:var(--dim); cursor:pointer;
    display:flex; align-items:center; justify-content:space-between; transition:.1s; }
  .ddopt:hover { background:var(--panel2); color:var(--text); }
  .ddopt.on { color:var(--text); font-weight:600;
    background:color-mix(in srgb, var(--accent) 14%, var(--panel2)); }
  .ddopt.on::after { content:""; width:6px; height:6px; border-radius:50%; background:var(--accent); }
  .mbtns { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  .mbtns button { background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:6px 14px; font-size:13px; cursor:pointer; font-family:inherit; }
  .mbtns button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .mbtns button.danger { background:#a84848; border-color:#a84848; color:#fff; }
</style><style>/* crit-nofocus */ *:focus, *:focus-visible { outline: none !important; box-shadow: none; }</style><style>/* crit-modal-label: 모달 라벨이 세로로 꺾이지 않게 */ .modal .mrow > span:first-child { flex: none; white-space: nowrap; }</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><!-- crit-font --><style>/* crit-scrollbar: 얇은 테마 스크롤바 (화살표 버튼 제거) */

.gologbtn { background: color-mix(in srgb, var(--accent) 20%, var(--panel2)) !important;
  border-color: color-mix(in srgb, var(--accent) 48%, var(--line)) !important;
  color: color-mix(in srgb, var(--accent) 58%, var(--text)) !important; }
</style><style>.toolbar, .catbar, .ctl, .fadd, .fdel, #previewbtn, .gdel, .sdel, .srsz, .srot, .bctrl, .bph, .pimg .ph, .gadd, .sadd, .addbtn, .tagadd, .exaddbtn, .imgaddbtn, .pdel, .composer, .del, .tag .x, .badge .x, .teditbtn, .gologbtn, .newbtn, #trashbtn, select { display: none !important; } button:not(.linkbtn):not(.critkeep) { display: none !important; } input, textarea { pointer-events: none !important; } .sbox input, .msearch input { pointer-events: auto !important; } .mbtnrow { display: none !important; } .crit-mdview { display: block !important; } .topnav { border-bottom: none !important; flex: none !important; } #critscroll { scrollbar-gutter: stable; overflow-x: clip; } .dayview { position: static !important; top: auto !important; } .crit-pub-range { display:inline-block; width:100%; height:6px; background:var(--panel2); border-radius:999px; position:relative; } .crit-pub-range i { position:absolute; top:50%; width:14px; height:14px; border-radius:50%; background:var(--accent); border:2.5px solid color-mix(in srgb, var(--accent) 25%, var(--panel)); transform:translate(-50%,-50%); box-sizing:border-box; }</style></head>
