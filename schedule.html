<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crit — 스케줄러</title>
<style>
  :root {
    --accent:#B26A9E;
    color-scheme: dark;              /* 네이티브 날짜/시간 선택기를 다크로 */
    accent-color: var(--accent);     /* 선택기 하이라이트에 포인트 컬러 */
    --bg:     color-mix(in srgb, var(--accent) 5%,  #131216);
    --panel:  color-mix(in srgb, var(--accent) 8%, #1d1b21);
    --panel2: color-mix(in srgb, var(--accent) 10%, #26242c);
    --line:   color-mix(in srgb, var(--accent) 18%, #34313a);
    --text:   color-mix(in srgb, var(--accent) 5%,  #f0edf3);
    --dim:    color-mix(in srgb, var(--accent) 12%, #9a95a0);
    --desc:   color-mix(in srgb, var(--accent) 12%, #d1cdd8);
  }
  body.light {
    color-scheme: light;
    --bg:     color-mix(in srgb, var(--accent) 3%,  #f7f6f8);
    --panel:  color-mix(in srgb, var(--accent) 4%,  #ffffff);
    --panel2: color-mix(in srgb, var(--accent) 5%,  #efedf1);
    --line:   color-mix(in srgb, var(--accent) 13%, #d9d6dd);
    --text:   color-mix(in srgb, var(--accent) 8%, #27242a);
    --dim:    color-mix(in srgb, var(--accent) 9%, #6f6a76);
    --desc:   color-mix(in srgb, var(--accent) 15%, #565060);
  }
  * { box-sizing:border-box; }
  html { scrollbar-width:thin; scrollbar-color: color-mix(in srgb, var(--accent) 45%, var(--line)) transparent; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius:8px; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; line-height:1.6; }
  .wrap { max-width:1060px; margin:0 auto; padding:20px 16px 60px; }

  .toolbar { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(8px); display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    padding:10px 2px; margin-bottom:12px; border-bottom:1px solid var(--line); }
  .toolbar .ttl { font-size:14px; font-weight:700; margin-right:auto; }
  .toolbar button { background:var(--panel2); color:var(--dim); border:1px solid var(--line);
    border-radius:8px; padding:5px 11px; font-size:12.5px; cursor:pointer; font-family:inherit; }
  .toolbar button.on { color:var(--text); border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 18%, var(--panel2)); }
  .iconbtn { display:flex; align-items:center; justify-content:center; padding:5px 9px; }
  .catrow { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .catrow input[type=color] { width:30px; height:24px; border:none; background:none; padding:0; cursor:pointer; flex:none; }
  .catrow input[type=text] { flex:1; background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:5px 9px; font-size:12.5px; font-family:inherit; outline:none; min-width:0; }
  .catrow input[type=text]:focus { border-color:var(--accent); }
  .cat-chip.allchip { padding:4px 12px; color:var(--dim); }
  .cat-chip.allchip:hover { color:var(--text); border-color:var(--accent); }
  .settings { position:relative; }
  .spanel { display:none; position:absolute; right:0; top:36px; z-index:20; width:270px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px;
    box-shadow:0 10px 30px #0008; }
  .spanel.open { display:block; }
  .spanel h4 { margin:0 0 8px; font-size:12.5px; color:var(--dim); font-weight:600; }
  .srow { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; margin-bottom:8px; }
  .srow input[type=color] { width:34px; height:24px; border:none; background:none; padding:0; cursor:pointer; }
  .srow label { display:flex; align-items:center; gap:4px; font-size:12.5px; color:var(--dim); cursor:pointer; }
  .cwrap { display:flex; align-items:center; gap:6px; }
  .hexin { width:74px; background:var(--panel2); border:1px solid var(--line); border-radius:6px;
    color:var(--text); font-size:12px; padding:4px 6px; font-family:Consolas,"D2Coding",monospace; }
  input::placeholder, textarea::placeholder { color:color-mix(in srgb, var(--accent) 30%, var(--dim)); }
  input[type=checkbox], input[type=radio] {
    appearance:none; -webkit-appearance:none; width:15px; height:15px; flex:none;
    border:1.5px solid var(--line); background:var(--panel2); cursor:pointer;
    margin:0 3px 0 0; vertical-align:-2px; transition:.12s; }
  input[type=checkbox] { border-radius:4.5px; }
  input[type=radio] { border-radius:50%; }
  input[type=checkbox]:checked { background:var(--accent)
    url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 7"/></svg>')
    center/10px 10px no-repeat; border-color:var(--accent); }
  input[type=radio]:checked { background:var(--accent); border-color:var(--accent);
    box-shadow:inset 0 0 0 3px var(--panel); }

  /* 카테고리 필터 */
  .catbar { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .cat-chip { display:flex; align-items:center; gap:7px; background:var(--panel2); border:1px solid var(--line);
    border-radius:999px; padding:4px 12px 4px 8px; cursor:pointer; user-select:none; font-size:12.5px;
    font-weight:600; transition:.15s; }
  .cat-chip:has(input:not(:checked)) { opacity:.35; }
  .cat-chip input { display:none; }
  .cat-chip .dot { width:11px; height:11px; border-radius:50%; flex:none; }
  .cat-chip .hintr { font-size:10px; color:var(--dim); font-weight:400; }

  /* 레이아웃: 좌 day-view + 우 캘린더 */
  .layout { display:flex; gap:14px; align-items:flex-start; }
  .dayview { width:270px; flex:none; background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding:16px 18px; position:sticky; top:0; }
  .dv-date { font-size:17px; font-weight:800; letter-spacing:-.4px; margin-bottom:2px; }
  .dv-sub { font-size:12px; color:var(--dim); margin-bottom:12px; }
  .dv-item { border-left:3px solid; border-radius:6px; padding:6px 10px; margin-bottom:8px;
    background:var(--panel2); cursor:pointer; }
  .dv-item:hover { background:color-mix(in srgb, var(--accent) 10%, var(--panel2)); }
  .dv-item .t { font-size:13px; font-weight:700; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .dv-item .time { font-size:11.5px; color:var(--dim); font-weight:600; }
  .dv-item .desc2 { font-size:12px; color:var(--desc); margin-top:2px; white-space:pre-wrap; }
  .tbd { font-size:10px; padding:1px 7px; border-radius:999px; background:var(--panel);
    border:1px dashed var(--dim); color:var(--dim); font-weight:600; }
  .dv-empty { font-size:12.5px; color:var(--dim); font-style:italic; }
  .dv-add { width:100%; margin-top:6px; background:var(--panel2); border:1px dashed var(--line);
    border-radius:8px; color:var(--dim); font-family:inherit; font-size:12.5px; padding:8px; cursor:pointer; }
  .dv-add:hover { border-color:var(--accent); color:var(--text); }

  /* 캘린더 */
  .cal { flex:1; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px 18px; }
  .cal-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .cal-title { font-size:16px; font-weight:800; letter-spacing:-.4px; margin-right:auto; }
  .cal-head button { background:var(--panel2); color:var(--dim); border:1px solid var(--line);
    border-radius:8px; padding:4px 10px; font-size:12px; cursor:pointer; font-family:inherit; display:flex; align-items:center; }
  .cal-head button:hover { color:var(--text); border-color:var(--accent); }
  .cal-grid { display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); gap:4px; }
  .cal-dow { text-align:center; font-size:11px; color:var(--dim); font-weight:700; padding:4px 0; }
  .cal-dow.sun { color:#d98a8a; } .cal-dow.sat { color:#8aa8d9; }
  .cal-cell { height:104px; min-width:0; overflow:hidden; background:var(--panel2); border:1px solid transparent;
    border-radius:10px; padding:6px 7px; cursor:pointer; transition:.12s; display:flex; flex-direction:column; gap:3px; }
  /* 세없날 (세션 없는 날) */
  .cal-cell.nosess { background:repeating-linear-gradient(135deg,
    var(--panel2) 0 9px, color-mix(in srgb, var(--line) 50%, var(--panel2)) 9px 11px); }
  .nosess-tag { font-size:9.5px; font-weight:700; color:var(--dim); background:var(--panel);
    border:1px dashed var(--dim); border-radius:999px; padding:0 6px; align-self:flex-start; }
  .cal-cell:hover { border-color:var(--line); }
  .cal-cell.other { opacity:.35; }
  .cal-cell.sel { border-color:var(--accent); }
  .drow { display:flex; align-items:center; gap:5px; }
  .cal-cell .dnum { font-size:11.5px; font-weight:700; color:var(--dim); }
  .cal-cell.today .dnum { color:#fff; background:var(--accent); width:20px; height:20px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; }
  .blk { font-size:11px; font-weight:600; border-left:3px solid; border-radius:4px;
    padding:1px 6px; background:color-mix(in srgb, var(--panel) 70%, transparent);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:none; }
  .blk.tbdblk { opacity:.55; font-style:italic; }
  /* 장기(기간) 연속 바 */
  .blk.range { border-left:none; border-radius:0; margin-left:-8px; margin-right:-8px; cursor:pointer; }
  .blk.range.rstart { margin-left:0; border-radius:4px 0 0 4px; }
  .blk.range.rend { margin-right:0; border-radius:0 4px 4px 0; }
  .blk.range.rstart.rend { border-radius:4px; }
  /* day view 드래그 정렬 */
  .dv-item { user-select:none; }
  .dv-item.dragging { opacity:.4; }
  .dv-item.dropover { outline:1.5px dashed var(--accent); outline-offset:2px; }

  footer { margin-top:22px; color:var(--dim); font-size:12px; text-align:center; }

  /* 반응형 정책: 완전 반응형 대신 최소 크기 + 가로 스크롤, 일정 폭 이하는 모바일 주간 뷰 */
  .mobile { display:none; }
  @media (min-width: 641px) {
    .wrap { min-width: 920px; }   /* 데스크톱 레이아웃 최소 크기 — 더 줄이면 가로 스크롤 */
  }
  @media (max-width: 640px) {
    .layout { display:none; }
    .mobile { display:block; }
    .wrap { padding-top: 10px; }
  }
  .m-head { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .m-range { font-size:15px; font-weight:800; letter-spacing:-.3px; margin-right:auto; }
  .m-head button { background:var(--panel2); color:var(--dim); border:1px solid var(--line);
    border-radius:8px; padding:4px 10px; font-size:12px; cursor:pointer; font-family:inherit;
    display:flex; align-items:center; }
  .m-head button:hover { color:var(--text); border-color:var(--accent); }
  .m-day { background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; margin-bottom:8px; }
  .m-day.today { border-color:var(--accent); }
  .m-day.nosess { background:repeating-linear-gradient(135deg,
    var(--panel) 0 9px, color-mix(in srgb, var(--line) 40%, var(--panel)) 9px 11px); }
  .m-date { display:flex; align-items:center; gap:7px; font-size:13px; font-weight:800; margin-bottom:6px; }
  .m-date .dow { color:var(--dim); font-weight:600; font-size:12px; }
  .m-date .todaytag { font-size:10px; color:#fff; background:var(--accent); border-radius:999px; padding:0 7px; }
  .m-date .madd { margin-left:auto; background:none; border:1px dashed var(--line); border-radius:7px;
    color:var(--dim); font-family:inherit; font-size:11px; padding:1px 9px; cursor:pointer; }
  .m-date .madd:hover { border-color:var(--accent); color:var(--text); }
  .m-empty { font-size:12px; color:var(--dim); font-style:italic; }

  /* 우클릭 메뉴 */
  .ctxmenu { position:fixed; z-index:50; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:4px; min-width:150px; box-shadow:0 10px 30px #000a; }
  .ctxmenu button { display:block; width:100%; text-align:left; background:none; border:none;
    color:var(--text); font-size:12.5px; padding:7px 12px; border-radius:7px; cursor:pointer; font-family:inherit; }
  .ctxmenu button:hover { background:color-mix(in srgb, var(--accent) 22%, var(--panel2)); }

  /* 배포 미리보기 */
  .pvov { position:fixed; inset:0; z-index:70; background:var(--bg); overflow:auto; }
  .pvin { max-width:880px; margin:0 auto; padding:24px 16px 60px; }
  .pv-head { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .pv-title { font-size:17px; font-weight:800; letter-spacing:-.4px; margin-right:auto; }
  .pv-sub { color:var(--dim); font-size:12px; margin-bottom:14px; }
  .pv-cell { height:96px; min-width:0; overflow:hidden; background:var(--panel2); border-radius:10px;
    padding:6px 7px; display:flex; flex-direction:column; gap:3px; }
  .pv-cell.other { opacity:.35; }
  .pv-cell.nosess { background:repeating-linear-gradient(135deg,
    var(--panel2) 0 9px, color-mix(in srgb, var(--line) 50%, var(--panel2)) 9px 11px); opacity:.75; }

  /* 모달 */
  .overlay { position:fixed; inset:0; z-index:60; background:#0008; display:flex; align-items:center; justify-content:center; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; width:330px; }
  .modal h3 { margin:0 0 12px; font-size:15px; }
  .mrow { display:flex; align-items:center; gap:10px; font-size:13px; margin-bottom:10px; }
  .mrow > span:first-child { flex:none; width:56px; color:var(--dim); }
  .mrow input[type=text], .mrow input[type=date], .mrow input[type=time], .mrow select {
    flex:1; background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:6px 9px; font-size:13px; font-family:inherit; outline:none; min-width:0; }
  .mrow input:focus, .mrow select:focus { border-color:var(--accent); }
  /* 드롭다운 화살표: 여백을 두고 커스텀 아이콘으로 */
  .mrow select { appearance:none; -webkit-appearance:none; padding-right:32px;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%239a95a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>');
    background-repeat:no-repeat; background-position:right 11px center; background-size:13px; }
  /* 날짜/시간 인풋의 달력·시계 아이콘: 테마에 맞게 밝기 보정 */
  input[type=date]::-webkit-calendar-picker-indicator,
  input[type=time]::-webkit-calendar-picker-indicator { cursor:pointer; opacity:.75; }
  input[type=date]::-webkit-calendar-picker-indicator:hover,
  input[type=time]::-webkit-calendar-picker-indicator:hover { opacity:1; }
  .modal textarea { width:100%; min-height:64px; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:8px; font-size:13px;
    font-family:inherit; resize:none; outline:none; }
  .hint { font-size:11.5px; color:var(--dim); margin:6px 0 0; }
  .mbtns { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  .mbtns button { background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:6px 14px; font-size:13px; cursor:pointer; font-family:inherit; }
  .mbtns button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .mbtns button.danger { background:#a84848; border-color:#a84848; color:#fff; }

  /* 상단 전역 메뉴 */
  .topnav { display:flex; gap:6px; align-items:center; padding:2px 2px 0; margin-bottom:6px; padding-bottom:9px;
    border-bottom:1px solid var(--line); }
  .navid { display:flex; align-items:center; gap:7px; font-size:13.5px; font-weight:800;
    letter-spacing:-.3px; margin-right:10px; padding:2px 2px; }
  .navgear { margin-left:auto; display:flex; padding:6px !important; border-radius:8px !important; }
  .topnav a, .topnav span.nv { padding:5px 14px; border-radius:999px; font-size:12.5px;
    color:var(--dim); text-decoration:none; border:1px solid transparent; transition:.12s; }
  .topnav a:hover { color:var(--text); border-color:var(--line); }
  .topnav .on { background:color-mix(in srgb, var(--accent) 16%, var(--panel2));
    border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line));
    color:var(--text); font-weight:600; }
  .topnav .memo { opacity:.55; cursor:help; }

      </div>

<script>
/* ── 데이터 ── */
/* toISOString()은 UTC 기준이라 한국(UTC+9) 새벽 시간대에는 실제 로컬 날짜보다 하루 전으로
   계산돼 "오늘" 표시가 하루 밀리는 문제가 있었다 - 달력 그리드는 UTC로 날짜를 세지만(DST
   회피용 트릭일 뿐, 실제 시각과 무관), TODAY는 사용자가 실제로 보는 "오늘"이어야 하므로
   로컬 날짜 요소로 계산해야 한다 */
function localTodayKey() {
  const n = new Date();
  return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0');
}
const TODAY = localTodayKey();
let cats = JSON.parse(document.body.dataset.cats || 'null') || [
  { key: 'life',  name: '현생',  color: '#5B8DB8', rename: false },
  { key: 'sess',  name: '세션',  color: '#B26A9E', rename: false },
  { key: 'long',  name: '장기',  color: '#5BA8A0', rename: false, ranged: true },
  { key: 'etc1',  name: '기타1', color: '#7BA05B', rename: true },
  { key: 'etc2',  name: '기타2', color: '#C98A5B', rename: true },
  { key: 'etc3',  name: '기타3', color: '#8A7BC9', rename: true },
  { key: 'etc4',  name: '기타4', color: '#9a95a0', rename: true },
];
/* 데모/더미 일정은 완전히 삭제했다 - 저장된 데이터가 없으면 빈 목록으로 시작한다 */
let schedules = JSON.parse(document.body.dataset.schedules || 'null') || [];
let seq = 100;
let view = TODAY.slice(0, 7);           // 'YYYY-MM'
let selected = TODAY;
let noSess = new Set(JSON.parse(document.body.dataset.nosess || '["2026-07-27","2026-07-30"]'));
let dragId = null;
function save() {
  document.body.dataset.cats = JSON.stringify(cats);
  document.body.dataset.schedules = JSON.stringify(schedules);
  document.body.dataset.nosess = JSON.stringify([...noSess]);
}
const catOf = k => cats.find(c => c.key === k) || cats[0];
const activeCats = () => new Set([...document.querySelectorAll('#catbar input:checked')].map(i => i.dataset.cat));
/* 하루 일정 정렬: 사용자 지정 순서(ord) 우선, 없으면 시간순 */
function sortDay(arr) {
  return arr.sort((a, b) => {
    const ao = a.ord ?? 999, bo = b.ord ?? 999;
    if (ao !== bo) return ao - bo;
    return (a.time || '99') < (b.time || '99') ? -1 : 1;
  });
}
const coversDay = (s, ds) => s.end ? (s.date <= ds && ds <= s.end) : s.date === ds;

/* ── 카테고리 바 ── */
function renderCats() {
  const bar = document.getElementById('catbar');
  const prevActive = bar.querySelector('input[data-cat]') ? activeCats() : null;
  bar.innerHTML = '';
  /* All 칩: 전체 켜기/끄기 */
  const allChip = document.createElement('span');
  allChip.className = 'cat-chip allchip';
  allChip.textContent = 'All';
  allChip.title = '전체 선택/해제';
  allChip.addEventListener('click', () => {
    const boxes = [...document.querySelectorAll('#catbar input[data-cat]')];
    const allOn = boxes.every(b => b.checked);
    boxes.forEach(b => { b.checked = !allOn; });
    renderCal(); renderDay(); renderMobile();
  });
  bar.appendChild(allChip);
  cats.forEach(c => {
    const chip = document.createElement('label');
    chip.className = 'cat-chip';
    chip.innerHTML = `<input type="checkbox" ${!prevActive || prevActive.has(c.key) ? 'checked' : ''} data-cat="${c.key}">
      <span class="dot" style="background:${c.color}"></span><span class="cname">${c.name}</span>`;
    chip.title = '클릭: 켜기/끄기 · 우클릭: 이 카테고리만 보기';
    chip.querySelector('input').addEventListener('change', () => { renderCal(); renderDay(); renderMobile(); });
    /* 우클릭: 이 카테고리만 보기 (솔로) */
    chip.addEventListener('contextmenu', e => {
      e.preventDefault(); e.stopPropagation();
      document.querySelectorAll('#catbar input[data-cat]').forEach(b => {
        b.checked = (b.dataset.cat === c.key);
      });
      renderCal(); renderDay(); renderMobile();
    });
    bar.appendChild(chip);
  });
}

/* 톱니바퀴 패널: 카테고리 이름·색상 편집 */
function renderCatRows() {
  const box = document.getElementById('catrows');
  box.innerHTML = '';
  cats.forEach(c => {
    const row = document.createElement('div');
    row.className = 'catrow';
    row.innerHTML = `<input type="text" class="hexin" value="${c.color}" spellcheck="false" style="flex:none;width:64px"><input type="color" value="${c.color}"><input type="text" value="${c.name.replace(/"/g,'&quot;')}">`;
    const colEl = row.querySelector('input[type=color]');
    const hexEl = row.querySelector('input.hexin');
    wireHex(hexEl, colEl, () => {
      c.color = colEl.value; save(); renderCats(); renderCal(); renderDay(); renderMobile();
    });
    row.querySelector('input[type=text]:not(.hexin)').addEventListener('input', e => {
      c.name = e.target.value.trim() || c.name; save(); renderCats(); renderCal(); renderDay(); renderMobile();
    });
    box.appendChild(row);
  });
}

/* ── 캘린더 ── */
function ymd(d) { return d.toISOString().slice(0, 10); }
function renderCal() {
  const [y, m] = view.split('-').map(Number);
  document.getElementById('caltitle').textContent = `${y}년 ${m}월`;
  const grid = document.getElementById('calgrid');
  grid.innerHTML = '';
  ['일','월','화','수','목','금','토'].forEach((d, i) => {
    const el = document.createElement('div');
    el.className = 'cal-dow' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '');
    el.textContent = d;
    grid.appendChild(el);
  });
  const first = new Date(Date.UTC(y, m - 1, 1));
  const start = new Date(first); start.setUTCDate(1 - first.getUTCDay());
  const act = activeCats();
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setUTCDate(start.getUTCDate() + i);
    const ds = ymd(d);
    const cell = document.createElement('div');
    cell.className = 'cal-cell'
      + (d.getUTCMonth() !== m - 1 ? ' other' : '')
      + (ds === TODAY ? ' today' : '')
      + (ds === selected ? ' sel' : '')
      + (noSess.has(ds) ? ' nosess' : '');
    cell.dataset.date = ds;
    cell.innerHTML = `<span class="drow"><span class="dnum">${d.getUTCDate()}</span>`
      + (noSess.has(ds) ? '<span class="nosess-tag">세없날</span>' : '') + `</span>`;
    /* 장기(기간) 바 — 상단에 이어지는 느낌으로 */
    schedules.filter(s => s.end && act.has(s.cat) && s.date <= ds && ds <= s.end).forEach(s => {
      const c = catOf(s.cat);
      const isStart = s.date === ds, isEnd = s.end === ds;
      const b = document.createElement('div');
      b.className = 'blk range' + (isStart ? ' rstart' : '') + (isEnd ? ' rend' : '') + (s.tbd ? ' tbdblk' : '');
      b.style.background = `color-mix(in srgb, ${c.color} 26%, var(--panel2))`;
      if (isStart) b.style.borderLeft = `3px solid ${c.color}`;
      /* 줄이 바뀌면(일요일) 이름을 한 번 더 표시 */
      b.textContent = (isStart || d.getUTCDay() === 0) ? s.title : ' ';
      b.title = `${c.name} · ${s.title} (${s.date} ~ ${s.end})`;
      b.addEventListener('click', e => {
        e.stopPropagation();
        /* 게시본은 편집 불가 - 대신 이벤트를 눌러도 그 날짜가 선택되게 */
        if (window.CRIT_SCHED_PUB) { selected = ds; renderAll(); return; }
        openForm(s);
      });
      cell.appendChild(b);
    });
    sortDay(schedules.filter(s => !s.end && s.date === ds && act.has(s.cat)))
      .forEach(s => {
        const c = catOf(s.cat);
        const b = document.createElement('div');
        b.className = 'blk' + (s.tbd ? ' tbdblk' : '');
        b.style.borderLeftColor = c.color;
        b.textContent = (s.time ? s.time + ' ' : '') + s.title;
        b.title = c.name + (s.tbd ? ' · 미정' : '');
        b.addEventListener('click', e => {
        e.stopPropagation();
        /* 게시본은 편집 불가 - 대신 이벤트를 눌러도 그 날짜가 선택되게 */
        if (window.CRIT_SCHED_PUB) { selected = ds; renderAll(); return; }
        openForm(s);
      });
        cell.appendChild(b);
      });
    cell.addEventListener('click', () => { selected = ds; renderAll(); });
    grid.appendChild(cell);
  }
}

/* ── day view ── */
function renderDay() {
  const dv = document.getElementById('dayview');
  const d = new Date(selected + 'T00:00:00Z');
  const dows = ['일','월','화','수','목','금','토'];
  const act = activeCats();
  const items = sortDay(schedules.filter(s => coversDay(s, selected) && act.has(s.cat)));
  dv.innerHTML = `<div class="dv-date">${d.getUTCMonth() + 1}월 ${d.getUTCDate()}일 (${dows[d.getUTCDay()]})</div>
    <div class="dv-sub">${selected === TODAY ? '오늘' : ''}&nbsp;</div>`;
  if (!items.length) {
    const e = document.createElement('div');
    e.className = 'dv-empty'; e.textContent = '등록된 일정이 없어요.';
    dv.appendChild(e);
  }
  items.forEach(s => {
    const c = catOf(s.cat);
    const it = document.createElement('div');
    it.className = 'dv-item';
    it.style.borderLeftColor = c.color;
    it.innerHTML = `<div class="t"><span class="time">${s.time || ''}</span>${s.title}
      ${s.tbd ? '<span class="tbd">미정</span>' : ''}
      <span style="font-size:10px;color:${c.color};font-weight:700">${c.name}</span></div>
      ${s.end ? `<div class="desc2">${s.date} ~ ${s.end}</div>` : ''}
      ${s.desc ? `<div class="desc2">${s.desc}</div>` : ''}`;
    it.addEventListener('click', () => openForm(s));
    /* 드래그앤드롭으로 순서 변경 */
    it.draggable = true;
    it.addEventListener('dragstart', () => { dragId = s.id; it.classList.add('dragging'); });
    it.addEventListener('dragend', () => { dragId = null; it.classList.remove('dragging'); });
    it.addEventListener('dragover', e => { e.preventDefault(); it.classList.add('dropover'); });
    it.addEventListener('dragleave', () => it.classList.remove('dropover'));
    it.addEventListener('drop', e => {
      e.preventDefault(); it.classList.remove('dropover');
      if (!dragId || dragId === s.id) return;
      const ids = items.map(x => x.id);
      const from = ids.indexOf(dragId), to = ids.indexOf(s.id);
      ids.splice(to, 0, ids.splice(from, 1)[0]);
      ids.forEach((id, idx) => {
        const sc = schedules.find(x => x.id === id);
        if (sc) sc.ord = idx;
      });
      save(); renderAll();
    });
    dv.appendChild(it);
  });
  const add = document.createElement('button');
  add.className = 'dv-add'; add.textContent = '+ 일정 추가';
  add.addEventListener('click', () => openForm(null));
  dv.appendChild(add);
}
/* ── 모바일 주간 뷰 (좁은 화면) ── */
function weekStartOf(ds) {
  const d = new Date(ds + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() - d.getUTCDay());
  return ymd(d);
}
let mweek = weekStartOf(TODAY);
function renderMobile() {
  const box = document.getElementById('mobile');
  if (!box) return;
  const act = activeCats();
  const dows = ['일','월','화','수','목','금','토'];
  const start = new Date(mweek + 'T00:00:00Z');
  const end = new Date(start); end.setUTCDate(start.getUTCDate() + 6);
  const fmt = d => `${d.getUTCMonth() + 1}.${d.getUTCDate()}`;
  box.innerHTML = `<div class="m-head">
    <span class="m-range">${fmt(start)} ~ ${fmt(end)}</span>
    <button id="m-prev"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button id="m-today">이번 주</button>
    <button id="m-next"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>`;
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setUTCDate(start.getUTCDate() + i);
    const ds = ymd(d);
    const day = document.createElement('div');
    day.className = 'm-day' + (ds === TODAY ? ' today' : '') + (noSess.has(ds) ? ' nosess' : '');
    day.innerHTML = `<div class="m-date">${d.getUTCDate()} <span class="dow">${dows[d.getUTCDay()]}</span>
      ${ds === TODAY ? '<span class="todaytag">오늘</span>' : ''}
      ${noSess.has(ds) ? '<span class="nosess-tag">세없날</span>' : ''}
      <button class="madd">+ 추가</button></div>`;
    day.querySelector('.madd').addEventListener('click', () => { selected = ds; openForm(null); });
    const items = sortDay(schedules.filter(s => coversDay(s, ds) && act.has(s.cat)));
    if (!items.length) {
      const e = document.createElement('div');
      e.className = 'm-empty'; e.textContent = '일정 없음';
      day.appendChild(e);
    }
    items.forEach(s => {
      const c = catOf(s.cat);
      const it = document.createElement('div');
      it.className = 'dv-item';
      it.style.borderLeftColor = c.color;
      it.innerHTML = `<div class="t"><span class="time">${s.time || ''}</span>${s.title}
        ${s.tbd ? '<span class="tbd">미정</span>' : ''}
        <span style="font-size:10px;color:${c.color};font-weight:700">${c.name}</span></div>
        ${s.end ? `<div class="desc2">${s.date} ~ ${s.end}</div>` : ''}`;
      it.addEventListener('click', () => openForm(s));
      day.appendChild(it);
    });
    box.appendChild(day);
  }
  box.querySelector('#m-prev').addEventListener('click', () => {
    const d = new Date(mweek + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() - 7);
    mweek = ymd(d); renderMobile();
  });
  box.querySelector('#m-next').addEventListener('click', () => {
    const d = new Date(mweek + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + 7);
    mweek = ymd(d); renderMobile();
  });
  box.querySelector('#m-today').addEventListener('click', () => { mweek = weekStartOf(TODAY); renderMobile(); });
}
function renderAll() { renderCats(); renderCal(); renderDay(); renderMobile(); renderMobile(); }

/* ── 일정 폼 ── */
function openForm(s, prefill) {
  if (window.CRIT_SCHED_PUB) return; /* 게시본은 편집 불가 */
  const isNew = !s;
  /* prefill: "동일일정추가"에서 넘어온 복사본. s는 없어서(=새 일정) 저장하면 원본을
     덮어쓰지 않고 새로 추가되지만, 필드 값은 원본을 그대로 복사해서 시작한다 */
  const data = prefill || s || { date: selected, time: '', cat: 'sess', title: '', desc: '', tbd: false };
  const opts = cats.map(c => `<option value="${c.key}" ${c.key === data.cat ? 'selected' : ''}>${c.name}</option>`).join('');
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal"><h3>${isNew ? '일정 추가' : '일정 수정'}</h3>
    <div class="mrow"><span>카테고리</span><select id="f-cat">${opts}</select></div>
    <div class="mrow"><span>제목</span><input type="text" id="f-title" value="${(data.title || '').replace(/"/g,'&quot;')}" placeholder="일정 제목"></div>
    <div class="mrow"><span id="f-datelabel">날짜</span><input type="date" id="f-date" value="${data.date}"></div>
    <div class="mrow" id="f-endrow" style="display:none"><span>종료일</span><input type="date" id="f-end" value="${data.end || data.date}"></div>
    <div class="mrow" id="f-timerow"><span>시간</span><input type="time" id="f-time" value="${data.time || ''}"><label style="flex:none"><input type="checkbox" id="f-tbd" ${data.tbd ? 'checked' : ''}> 미정</label></div>
    <textarea id="f-desc" placeholder="내용 (선택)">${data.desc || ''}</textarea>
    <div class="mbtns">${isNew ? '' : '<button id="f-dup" style="margin-right:auto">동일일정</button><button class="danger" id="f-del">삭제</button>'}
      <button id="f-cancel">취소</button><button class="primary" id="f-ok">${isNew ? '추가' : '저장'}</button></div></div>`;
  document.body.appendChild(ov);
  /* 장기 카테고리: 시작일/종료일 UI 전환 */
  const syncRanged = () => {
    const ranged = !!(catOf(ov.querySelector('#f-cat').value).ranged);
    ov.querySelector('#f-endrow').style.display = ranged ? 'flex' : 'none';
    ov.querySelector('#f-timerow').style.display = ranged ? 'none' : 'flex';
    ov.querySelector('#f-datelabel').textContent = ranged ? '시작일' : '날짜';
  };
  ov.querySelector('#f-cat').addEventListener('change', syncRanged);
  syncRanged();
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  ov.querySelector('#f-cancel').addEventListener('click', () => ov.remove());
  ov.querySelector('#f-ok').addEventListener('click', () => {
    const ranged = !!(catOf(ov.querySelector('#f-cat').value).ranged);
    const startD = ov.querySelector('#f-date').value || data.date;
    let endD = ov.querySelector('#f-end').value || startD;
    if (endD < startD) endD = startD;
    const nd = {
      id: s ? s.id : 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      date: startD,
      end: ranged ? endD : null,
      time: ranged ? null : (ov.querySelector('#f-time').value || null),
      cat: ov.querySelector('#f-cat').value,
      title: ov.querySelector('#f-title').value.trim() || '(제목 없음)',
      desc: ov.querySelector('#f-desc').value.trim(),
      tbd: ov.querySelector('#f-tbd').checked,
    };
    if (s) Object.assign(s, nd); else schedules.push(nd);
    selected = nd.date;
    save(); renderAll(); ov.remove();
  });
  const del = ov.querySelector('#f-del');
  if (del) del.addEventListener('click', () => {
    ov.remove();
    confirmModal('이 일정을 삭제할까요?', '삭제', () => {
      schedules = schedules.filter(x => x.id !== s.id);
      save(); renderAll();
    });
  });
  /* 동일일정추가: 지금 폼에 채워진(수정 중이면 그 수정 내용까지) 값을 그대로 복사해서
     "일정 추가" 모달을 새로 연다 - s를 안 넘기므로 저장해도 원본은 안 바뀌고 새 일정이
     하나 더 생긴다. 날짜만 다시 골라서 등록하면 되도록 나머지는 전부 그대로 채워둔다 */
  const dup = ov.querySelector('#f-dup');
  if (dup) dup.addEventListener('click', () => {
    const ranged = !!(catOf(ov.querySelector('#f-cat').value).ranged);
    const copy = {
      date: ov.querySelector('#f-date').value || data.date,
      end: ranged ? (ov.querySelector('#f-end').value || data.date) : null,
      time: ranged ? '' : (ov.querySelector('#f-time').value || ''),
      cat: ov.querySelector('#f-cat').value,
      title: ov.querySelector('#f-title').value,
      desc: ov.querySelector('#f-desc').value,
      tbd: ov.querySelector('#f-tbd').checked,
    };
    ov.remove();
    openForm(null, copy);
  });
}
function confirmModal(msg, okLabel, onOk) {
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal"><h3>경고</h3>
    <div style="font-size:13px; line-height:1.6">${msg}</div>
    <div class="mbtns"><button id="wc">취소</button><button class="danger" id="wo">${okLabel}</button></div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  ov.querySelector('#wc').addEventListener('click', () => ov.remove());
  ov.querySelector('#wo').addEventListener('click', () => { ov.remove(); onOk(); });
}
/* 카테고리 편집: 이름 + 색상 */

  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal"><h3>카테고리 편집</h3>

let menu = null;

document.addEventListener('click', closeMenu);
document.addEventListener('contextmenu', e => {
  if (window.CRIT_SCHED_PUB) return; /* 게시본은 편집 불가 */
  const cell = e.target.closest('.cal-cell');
  if (!cell) return;
  e.preventDefault(); closeMenu();
  const ds = cell.dataset.date;
  menu = document.createElement('div'); menu.className = 'ctxmenu';
  const items = [
    ['일정 추가', () => { selected = ds; renderAll(); openForm(null); }],
    [noSess.has(ds) ? '세없날 해제' : '세없날로 지정', () => {
      noSess.has(ds) ? noSess.delete(ds) : noSess.add(ds);
      save(); renderAll();
    }],
  ];
  for (const [label, fn] of items) {
    const b = document.createElement('button'); b.textContent = label;
    b.addEventListener('click', () => { closeMenu(); fn(); });

  }
  menu.style.left = Math.min(e.clientX, innerWidth - 170) + 'px';

/* 미리보기에서 블록 클릭 → 상세 모달 (제목이 길거나 내용이 있을 때 확인용) */
function openPvDetail(s, c) {
  const d = new Date(s.date + 'T00:00:00Z');
  const dows = ['일','월','화','수','목','금','토'];
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.style.zIndex = 80;
  ov.innerHTML = `<div class="modal">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <span style="width:11px;height:11px;border-radius:50%;background:${c.color};flex:none"></span>
      <span style="font-size:11.5px;font-weight:700;color:${c.color}">${c.name}</span>
      ${s.tbd ? '<span class="tbd">미정</span>' : ''}
    </div>
    <div style="font-size:16px;font-weight:800;letter-spacing:-.3px;line-height:1.45;overflow-wrap:break-word">${s.title}</div>
    <div style="font-size:12.5px;color:var(--dim);margin:6px 0 ${s.desc ? '10px' : '0'}">
      ${s.end ? `${s.date.replace(/-/g, '.')} ~ ${s.end.replace(/-/g, '.')}` :
        `${d.getUTCMonth() + 1}월 ${d.getUTCDate()}일 (${dows[d.getUTCDay()]})${s.time ? ' · ' + s.time : ''}`}</div>
    ${s.desc ? `<div style="font-size:13px;color:var(--desc);white-space:pre-wrap;border-left:3px solid color-mix(in srgb, ${c.color} 60%, var(--line));padding-left:10px;overflow-wrap:break-word">${s.desc}</div>` : ''}
    <div class="mbtns"><button class="primary" id="dv-close">닫기</button></div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  ov.querySelector('#dv-close').addEventListener('click', () => ov.remove());
}

function openPreview(shared, shareNoSess) {
  let pview = view;
  const ov = document.createElement('div'); ov.className = 'pvov';
  ov.innerHTML = `<div class="pvin">
    <div class="pv-head">
      <span class="pv-title">무무의 스케줄 <span style="color:var(--dim);font-weight:400;font-size:12px">배포 미리보기</span></span>
      <button class="tb" id="pv-prev" style="background:var(--panel2);color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer;font-family:inherit"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="tb" id="pv-next" style="background:var(--panel2);color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer;font-family:inherit"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <button id="pv-close" style="background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:4px 14px;cursor:pointer;font-family:inherit;font-size:12.5px">닫기</button>
    </div>
    <div class="pv-sub" id="pv-sub"></div>
    <div class="cal-grid" id="pv-grid"></div>
  </div>`;
  document.body.appendChild(ov);
  function renderPv() {
    const [y, m] = pview.split('-').map(Number);
    ov.querySelector('#pv-sub').textContent = `${y}년 ${m}월`;
    const grid = ov.querySelector('#pv-grid');
    grid.innerHTML = '';
    ['일','월','화','수','목','금','토'].forEach((d, i) => {
      const el = document.createElement('div');
      el.className = 'cal-dow' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '');
      el.textContent = d;
      grid.appendChild(el);
    });
    const first = new Date(Date.UTC(y, m - 1, 1));
    const start = new Date(first); start.setUTCDate(1 - first.getUTCDay());
    for (let i = 0; i < 42; i++) {
      const d = new Date(start); d.setUTCDate(start.getUTCDate() + i);
      const ds = ymd(d);
      const cell = document.createElement('div');
      /* 앱 캘린더와 완전히 같은 셀 스타일을 재사용해 미리보기 분위기를 통일 */
      cell.className = 'cal-cell pvmode'
        + (d.getUTCMonth() !== m - 1 ? ' other' : '')
        + (ds === TODAY ? ' today' : '')
        + (noSess.has(ds) ? ' nosess' : '');
      cell.innerHTML = `<span class="drow"><span class="dnum">${d.getUTCDate()}</span>`
        + (noSess.has(ds) ? '<span class="nosess-tag">세없날</span>' : '') + `</span>`;
      if (!noSess.has(ds) || shareNoSess) {
        schedules.filter(s => s.end && shared.has(s.cat) && s.date <= ds && ds <= s.end).forEach(s => {
          const c = catOf(s.cat);
          const isStart = s.date === ds, isEnd = s.end === ds;
          const b = document.createElement('div');
          b.className = 'blk range' + (isStart ? ' rstart' : '') + (isEnd ? ' rend' : '') + (s.tbd ? ' tbdblk' : '');
          b.style.background = `color-mix(in srgb, ${c.color} 26%, var(--panel2))`;
          if (isStart) b.style.borderLeft = `3px solid ${c.color}`;
          b.textContent = (isStart || d.getUTCDay() === 0) ? s.title : ' ';
          b.addEventListener('click', () => openPvDetail(s, c));
          cell.appendChild(b);
        });
        sortDay(schedules.filter(s => !s.end && s.date === ds && shared.has(s.cat)))
          .forEach(s => {
            const c = catOf(s.cat);
            const b = document.createElement('div');
            b.className = 'blk' + (s.tbd ? ' tbdblk' : '');
            b.style.borderLeftColor = c.color;
            b.style.cursor = 'pointer';
            b.textContent = (s.time ? s.time + ' ' : '') + s.title;
            b.addEventListener('click', () => openPvDetail(s, c));
            cell.appendChild(b);
          });
      }
      grid.appendChild(cell);
    }
  }
  ov.querySelector('#pv-prev').addEventListener('click', () => {
    let [y, m] = pview.split('-').map(Number);
    m--; if (m < 1) { m = 12; y--; }
    pview = `${y}-${String(m).padStart(2, '0')}`; renderPv();
  });
  ov.querySelector('#pv-next').addEventListener('click', () => {
    let [y, m] = pview.split('-').map(Number);
    m++; if (m > 12) { m = 1; y++; }
    pview = `${y}-${String(m).padStart(2, '0')}`; renderPv();
  });
  ov.querySelector('#pv-close').addEventListener('click', () => ov.remove());
  renderPv();
}

/* ── 내비게이션 ── */
document.getElementById('prev').addEventListener('click', () => {

});
document.getElementById('next').addEventListener('click', () => {

const setbtn = document.getElementById('setbtn'), spanel = document.getElementById('spanel');

setbtn.addEventListener('click', e => { e.stopPropagation(); catpanel.classList.remove('open'); spanel.classList.toggle('open'); });
spanel.addEventListener('click', e => e.stopPropagation());

  e.stopPropagation(); spanel.classList.remove('open');

});
catpanel.addEventListener('click', e => e.stopPropagation());
document.addEventListener('click', () => { spanel.classList.remove('open'); catpanel.classList.remove('open'); });
const root = document.documentElement.style;
function applyTheme() { root.setProperty('--accent', document.getElementById('c-accent').value); }
/* hex 텍스트 입력 ↔ 색상 피커 양방향 동기화 (피커만 있으면 정확한 hex 값을 직접 입력할 방법이 없었어요) */
function wireHex(hexEl, colEl, onChange) {
  if (!hexEl || !colEl) return;
  hexEl.addEventListener('input', () => {
    let v = hexEl.value.trim();
    if (/^[0-9a-fA-F]{6}$/.test(v)) v = '#' + v;
    if (/^#[0-9a-fA-F]{6}$/.test(v)) { colEl.value = v.toLowerCase(); if (onChange) onChange(); }
  });
  hexEl.addEventListener('blur', () => { hexEl.value = colEl.value; });
  colEl.addEventListener('input', () => { hexEl.value = colEl.value; if (onChange) onChange(); });
}
(() => {
  const hex = document.getElementById('h-accent'), col = document.getElementById('c-accent');
  hex.addEventListener('input', () => {
    let v = hex.value.trim();
    if (/^[0-9a-fA-F]{6}$/.test(v)) v = '#' + v;
    if (/^#[0-9a-fA-F]{6}$/.test(v)) { col.value = v.toLowerCase(); applyTheme(); }
  });
  hex.addEventListener('blur', () => { hex.value = col.value; });
  col.addEventListener('input', () => { hex.value = col.value; applyTheme(); });
})();
document.querySelectorAll('input[name=thememode]').forEach(r => r.addEventListener('change', () => {
  document.body.classList.toggle('light', document.querySelector('input[name=thememode]:checked').value === 'light');
}));
document.getElementById('savebtn').addEventListener('click', () => {
  save();
  document.querySelectorAll('.overlay').forEach(o => o.remove());
  const clone = document.documentElement.cloneNode(true);
  const blob = new Blob(['<!DOCTYPE html>\n' + clone.outerHTML], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '스케줄러.html';
  a.click(); URL.revokeObjectURL(a.href);
});

renderAll();
</script>

<!-- Crit: 전역 테마 동기화 - 포인트 컬러/다크·라이트를 모든 화면이 공유합니다.
     (자관/로그 페이지는 전역 값을 기본값으로만 받고, 그 안의 테마 변경은 해당 페이지에만 적용) -->
<script>
(function () {
  var KEY = 'crit-global-theme';
  var t = {};
  try { t = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  var col = document.getElementById('c-accent');
  var hex = document.getElementById('h-accent');
  if (t.accent && col) {
    col.value = t.accent;
    if (hex) hex.value = t.accent;
    col.dispatchEvent(new Event('input', { bubbles: true }));
  }
  if (t.mode) {
    var r = document.querySelector('input[name=thememode][value="' + t.mode + '"]');
    if (r && !r.checked) {
      r.checked = true;
      r.dispatchEvent(new Event('change', { bubbles: true }));
    }
  }
})();
</script>

<script>
(function () {
  var KEY = 'crit-global-theme';
  function save(patch) {
    var t = {};
    try { t = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
    Object.assign(t, patch);
    localStorage.setItem(KEY, JSON.stringify(t));
  }
  var col = document.getElementById('c-accent');
  if (col) col.addEventListener('input', function () { save({ accent: col.value }); });
  document.querySelectorAll('input[name=thememode]').forEach(function (r) {
    r.addEventListener('change', function () {
      var c = document.querySelector('input[name=thememode]:checked');
      if (c) save({ mode: c.value });
    });
  });
})();
</script>
<!-- crit-nav-apply: 환경설정(crit-settings)의 닉네임/아바타/메뉴 순서를 상단 메뉴에 반영 + 메뉴 글씨 확대 -->
<style>
  html:not(.crit-embedded) .topnav a { font-size: 14px !important; padding: 4px 15px !important; }
  html:not(.crit-embedded) .navid { font-size: 15.5px !important; gap: 8px; }
  .topnav .nava { width: 30px; height: 30px; border-radius: 9px; background-size: cover;
    background-position: center; display: inline-block; vertical-align: middle; flex: none; }
</style>
<script>
(function () {
  var s = {};
  try { s = JSON.parse(localStorage.getItem("crit-settings")) || {}; } catch (e) {}
  var nav = document.querySelector(".topnav");
  if (!nav) return;
  /* 메뉴 순서 재배열 */
  if (Array.isArray(s.ordApp) && s.ordApp.length) {
    var gear = nav.querySelector(".navgear");
    s.ordApp.forEach(function (name) {
      var disp = ({ '스케줄': '일정', '메모장': '메모' })[name] || name;
      var a = Array.prototype.find.call(nav.querySelectorAll("a:not(.navgear)"), function (x) { return x.textContent.trim() === disp; });
      if (a) {
        nav.insertBefore(a, gear);
        /* 게시본(pubOn)처럼 데스크탑 앱도 "내가 쓰고 싶은 메뉴만" 보이게 체크 해제한
           항목은 상단 메뉴에서 숨긴다(실제 요청: "체크박스 만들어줘 설정에") */
        a.style.display = (s.appOn && s.appOn[name] === false) ? "none" : "";
      }
    });
  }
  /* 닉네임/아바타 (라운디드 스퀘어) */
  var id = nav.querySelector(".navid");
  if (id) {
    var nick = (s.nick != null && s.nick !== "") ? s.nick : (localStorage.getItem("crit-onboarded") === "1" ? id.textContent.trim() : "");
    var mode = s.idmode || "nick";
    id.textContent = "";
    if ((mode === "avatar" || mode === "both") && s.avatar) {
      var av = document.createElement("span");
      av.className = "nava";
      av.style.backgroundImage = "url(" + s.avatar + ")";
      id.appendChild(av);
    }
    if (mode === "nick" || mode === "both" || !s.avatar) id.appendChild(document.createTextNode(nick));
  }
})();
</script>

<!-- crit-publish: 업데이트 버튼 = 게시본 설정대로 전체 게시 -->
<script>
(function () {
  var btn = Array.prototype.find.call(document.querySelectorAll(".toolbar button, button"), function (b) {
    return b.textContent.trim() === "업데이트";
  });
  if (!btn) {
    var anchor = document.querySelector(".toolbar .settings");
    if (!anchor) return;
    btn = document.createElement("button");
    btn.textContent = "업데이트";
    btn.title = "변경 내용을 게시본에 반영 (GitHub 저장소 업데이트)";
    anchor.parentNode.insertBefore(btn, anchor);
  }
  btn.addEventListener("click", async function (e) {
    if (!window.api || !window.api.github || !window.api.github.publishSite) return;
    e.stopImmediatePropagation();
    e.preventDefault();
    var old = btn.textContent;
    btn.disabled = true; btn.textContent = "게시 중...";
    try { await window.critPublishAll(document.title.replace(/^Crit — /, "")); } finally { btn.disabled = false; btn.textContent = old; }
  }, true);
})();
</script>
<!-- crit-global-publish: 게시본 설정(순서/배포 체크)대로 모든 페이지를 스냅샷해 한 번에 게시 -->
<script>
(function () {
  var NAME2FILE = { "소개": "intro_editor.html", "스케줄": "scheduler.html", "자관": "jagwan.html",
    "로그": "logs.html", "타래": "threads.html", "메모장": "memo.html" };
  var FILE2OUT = { "intro_editor.html": "intro.html", "scheduler.html": "schedule.html", "jagwan.html": "jagwan.html",
    "logs.html": "logs.html", "threads.html": "threads.html", "memo.html": "memo.html" };

  function snapshotPage(src, pages) {
    return new Promise(function (resolve) {
      var f = document.createElement("iframe");
      f.style.cssText = "position:fixed;left:-99999px;top:0;width:1200px;height:900px;visibility:hidden";
      f.onload = function () {
        setTimeout(function () {
          var d = f.contentDocument;
          var clone = d.documentElement.cloneNode(true);
          clone.classList.remove("crit-embedded");
          clone.querySelectorAll("script").forEach(function (x) { x.remove(); });
          clone.querySelectorAll(".overlay, .ctxmenu, .spanel, .stkmenu").forEach(function (x) { x.remove(); });
          var nav = clone.querySelector(".topnav");
          if (nav) {
            nav.querySelectorAll("a").forEach(function (a) { a.remove(); });
            pages.forEach(function (n) {
              var a = d.createElement("a");
              a.setAttribute("href", FILE2OUT[NAME2FILE[n]]);
              a.textContent = n;
              if (NAME2FILE[n] === src) a.className = "on";
              nav.appendChild(a);
            });
          }
          var st2 = d.createElement("style");
          st2.textContent = ".toolbar, .ctl, .fadd, .fdel, .sbox, #previewbtn, .gdel, .sdel, .srsz, .srot, .bctrl, .bph, .pimg .ph, .gadd, .sadd, .addbtn, .tagadd, .exaddbtn, .imgaddbtn, .pdel, .composer, .del, input, textarea, select, button { display: none !important; } .crit-pub-range { display:inline-block; width:100%; height:6px; background:var(--panel2); border-radius:999px; position:relative; overflow:hidden; } .crit-pub-range i { position:absolute; left:0; top:0; bottom:0; border-radius:999px; background:var(--accent); } .topnav { border-bottom: none !important; box-shadow: none !important; }";
          var head = clone.querySelector("head");
          if (head) head.appendChild(st2);
          /* 게시본도 앱과 동일한 구조(메뉴 고정 + 아래 영역만 스크롤)가 되도록 재배치 */
          var bodyEl = clone.querySelector("body");
          var wrapEl = clone.querySelector(".wrap");
          if (bodyEl && nav && wrapEl && !clone.querySelector("#critscroll")) {
            bodyEl.insertBefore(nav, bodyEl.firstChild);
            var sc = d.createElement("div");
            sc.id = "critscroll";
            bodyEl.appendChild(sc);
            sc.appendChild(wrapEl);
            if (src === "logs.html" || src === "memo.html") wrapEl.style.height = "100%";
          }
          /* 입력값을 정적 텍스트/게이지로 치환 (게시본은 읽기 전용) */
          var oT = d.querySelectorAll("textarea"), cT = clone.querySelectorAll("textarea");
          for (var ti = 0; ti < cT.length; ti++) {
            var dv = d.createElement("div");
            dv.style.whiteSpace = "pre-wrap";
            dv.textContent = (oT[ti] && oT[ti].value) || "";
            cT[ti].parentNode.replaceChild(dv, cT[ti]);
          }
          var oI = d.querySelectorAll("input[type=text]"), cI = clone.querySelectorAll("input[type=text]");
          for (var ii = 0; ii < cI.length; ii++) {
            var sp = d.createElement("span");
            sp.textContent = (oI[ii] && oI[ii].value) || "";
            cI[ii].parentNode.replaceChild(sp, cI[ii]);
          }
          var oR = d.querySelectorAll("input[type=range]"), cR = clone.querySelectorAll("input[type=range]");
          for (var ri = 0; ri < cR.length; ri++) {
            var org = oR[ri];
            var pct = org ? ((org.value - (org.min || 0)) / (((org.max || 100) - (org.min || 0)) || 1) * 100) : 50;
            var bar = d.createElement("span");
            bar.className = "crit-pub-range";
            bar.innerHTML = "<i style=\"width:" + pct + "%\"></i>";
            cR[ri].parentNode.replaceChild(bar, cR[ri]);
          }
          /* 로그 페이지: 행 클릭 → 뷰어 열기 (뷰어 파일들은 함께 게시됨) */
          var userLogIds = [];
          if (src === "logs.html" && f.contentWindow.logsArr) {
            var rowmap = {};
            f.contentWindow.logsArr.forEach(function (l) {
              if (!l.f) return;
              var isUser = l.f.indexOf("log_viewer.html?id=") === 0;
              var pf = isUser ? ("log_" + l.id + ".html") : l.f;
              rowmap[l.id] = pf + "?preview=1";
              if (isUser) userLogIds.push(l.id);
            });
            var sc2 = d.createElement("script");
            sc2.textContent = "var M=" + JSON.stringify(rowmap) +
              ";document.querySelectorAll(\".lrow\").forEach(function(r){r.addEventListener(\"click\",function(){" +
              "var pf=M[r.dataset.lid];if(!pf)return;" +
              "document.getElementById(\"main\").innerHTML='<iframe src=\"'+pf+'\"></iframe>';" +
              "document.querySelectorAll(\".lrow\").forEach(function(x){x.classList.remove(\"on\")});r.classList.add(\"on\")})});";
            if (bodyEl) bodyEl.appendChild(sc2);
          }
          var html = "<!DOCTYPE html>\n" + clone.outerHTML;
          f.remove();
          resolve({ html: html, userLogIds: userLogIds });
        }, 700);
      };
      f.src = src + "?critsnap=" + Date.now();
      document.body.appendChild(f);
    });
  }

  function critToast(msg) {
    var t = document.createElement("div");
    t.textContent = msg;
    t.style.cssText = "position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:9999;" +
      "background:var(--panel,#1d1b21);color:var(--text,#fff);border:1px solid var(--line,#444);" +
      "border-radius:10px;padding:10px 16px;font-size:13px;box-shadow:0 10px 30px #0006";
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 3200);
  }
  window.critPublishAll = async function (label) {
    var api = window.api;
    /* 데스크탑 앱: 숨김 백그라운드 창에서 게시 - 메뉴를 이동해도 게시가 중단되지 않음 */
    if (api && api.publish && api.publish.runBackground) {
      var bg = await api.publish.runBackground(label || null);
      critToast(bg && bg.busy ? "이미 게시가 진행 중이에요." : "백그라운드에서 게시를 시작했어요. 완료되면 알림으로 알려드려요.");
      return true;
    }
    /* crit-publish-bg-only: 게시는 반드시 백그라운드 게시기(암호화·공유필터 적용)만 사용 */
    alert("게시 모듈을 불러오지 못했어요. 앱을 재시작한 뒤 다시 시도해주세요.");
    return false;
    if (!api || !api.github || !api.github.publishSite) { alert("게시는 데스크탑 앱에서만 할 수 있어요."); return; }
    var st = await api.app.getSettings();
    if (!st || !st.githubUsername) { alert("먼저 환경설정에서 깃허브를 연결해주세요."); return; }
    var cs = {};
    try { cs = JSON.parse(localStorage.getItem("crit-settings")) || {}; } catch (e) {}
    var ordPub = (cs.ordPub && cs.ordPub.length) ? cs.ordPub : ["소개", "스케줄", "자관", "로그", "타래"];
    var pubOn = cs.pubOn || {};
    var pages = ordPub.filter(function (n) { return pubOn[n] !== false && NAME2FILE[n]; });
    if (!pages.length) { alert("배포할 페이지가 없어요. 환경설정의 게시본 목록에서 체크해주세요."); return; }
    var files = {};
    var allUserLogs = [];
    for (var i = 0; i < pages.length; i++) {
      var snap = await snapshotPage(NAME2FILE[pages[i]], pages);
      files[FILE2OUT[NAME2FILE[pages[i]]]] = snap.html;
      if (snap.userLogIds && snap.userLogIds.length) allUserLogs = snap.userLogIds;
    }
    /* 로그를 게시하면 뷰어 파일들 + 가져온 로그 데이터 페이지도 함께 올린다 */
    if (pages.indexOf("로그") !== -1) {
      var viewerFiles = ["freelog.html"];
      for (var v = 0; v < viewerFiles.length; v++) {
        try { files[viewerFiles[v]] = await (await fetch(viewerFiles[v])).text(); } catch (e) {}
      }
      if (allUserLogs.length) {
        var lvTpl = await (await fetch("log_viewer.html")).text();
        allUserLogs.forEach(function (id) {
          var raw = localStorage.getItem("crit-log-data:" + id);
          if (!raw) return;
          var safe = raw.replace(/<\/script/gi, "<\\/script");
          files["log_" + id + ".html"] = lvTpl.replace("<body>",
            "<body><script>window.CRIT_LOG_DATA = " + safe + ";</scr" + "ipt>");
        });
      }
    }
    /* index = 소개 페이지 자체 (소개가 배포 목록에 없으면 첫 페이지) */
    var firstName = pages.indexOf("소개") !== -1 ? "소개" : pages[0];
    files["index.html"] = files[FILE2OUT[NAME2FILE[firstName]]];
    var r = await api.github.publishSite(files);
    if (r && r.error) { alert("게시 실패: " + r.error); return false; }
    alert("전체 게시 완료! 사이트 반영까지 몇 분 걸릴 수 있어요.\n" + (r && r.url ? r.url : ""));
    return true;
  };

  window.critOpenSite = async function () {
    var api = window.api;
    if (!api || !api.app) return;
    var st = await api.app.getSettings();
    if (st && st.githubSitePagesUrl) api.app.openExternal(st.githubSitePagesUrl);
    else alert("아직 게시된 사이트가 없어요. 먼저 업데이트(게시)를 해주세요.");
  };

  if (window.api && window.api.github) {
    var nav = document.querySelector(".topnav");
    var gear = nav ? nav.querySelector(".navgear") : null;
    if (nav && gear) {
      var mkIcon = function (title, svg, fn, autoLeft) {
        var a = document.createElement("a");
        a.href = "#";
        a.className = "navgear";
        a.title = title;
        a.innerHTML = svg;
        if (!autoLeft) a.style.marginLeft = "0";
        a.addEventListener("click", function (e) { e.preventDefault(); fn(a); });
        nav.insertBefore(a, gear);
        return a;
      };
      mkIcon("전체 업데이트 - 게시본 설정대로 모든 페이지를 GitHub에 게시",
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>',
        async function (a) {
          if (a.dataset.busy) return;
          a.dataset.busy = "1"; a.style.opacity = ".4";
          try { await window.critPublishAll(); } finally { delete a.dataset.busy; a.style.opacity = ""; }
        }, true);
      mkIcon("게시 사이트 열기",
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>',
        function () { window.critOpenSite(); }, false);
      gear.style.marginLeft = "0";
    }
  }
})();
</script>
<!-- crit-scroll-layout: 세로 스크롤이 상단 메뉴를 제외한 아래 영역에만 생기도록 재배치 -->
<style>
  html:not(.crit-embedded) body, html.crit-shell-real body { overflow: hidden; height: 100vh; margin: 0; padding: 0 !important;
    display: flex; flex-direction: column; }
  html:not(.crit-embedded) body > .topnav, html.crit-shell-real body > .topnav { position: static !important; flex: none; background: var(--bg);
    height: 54px; box-sizing: border-box; align-items: center; flex-wrap: nowrap; overflow: hidden;
    padding: 12px 20px 10px !important; margin: 0 !important; }
  html:not(.crit-embedded) #critscroll, html.crit-shell-real #critscroll { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
  html:not(.crit-embedded) #critscroll > .wrap, html.crit-shell-real #critscroll > .wrap { padding-top: 6px !important; margin-top: 0 !important; }
  html:not(.crit-embedded) .crit-fixedbar, html.crit-shell-real .crit-fixedbar { flex: none !important; display: block !important;
    height: auto !important; min-height: 0 !important; overflow: visible;
    padding-top: 2px !important; padding-bottom: 2px !important; margin-top: 0 !important; margin-bottom: 0 !important; }
  html:not(.crit-embedded) .crit-fixedbar .toolbar, html.crit-shell-real .crit-fixedbar .toolbar { margin-top: 0 !important; margin-bottom: 0 !important;
    padding-right: 22px !important; padding-left: 32px !important; }
  /* 이전 페이지 버튼은 항상 왼쪽에 */
  html:not(.crit-embedded) .crit-fixedbar .toolbar #backbtn, html.crit-shell-real .crit-fixedbar .toolbar #backbtn { justify-self: start; margin-right: auto; }
  html:not(.crit-embedded) .crit-fixedbar .toolbar .tleft, html.crit-shell-real .crit-fixedbar .toolbar .tleft { justify-content: flex-start; }
</style>
<script>
(function () {
  /* app-shell.html의 컨텐츠 iframe으로 감싸인 경우(crit-embedded)도 "진짜 앱" 취급해서
     2번째 헤더(툴바) 고정 레이아웃을 그대로 적용한다. 게시 스냅샷/미리보기 iframe(window.top.api
     없음)일 때만 원래의 좁은 비-재배치 레이아웃을 유지한다 */
  var html = document.documentElement;
  if (html.classList.contains("crit-embedded") && !html.classList.contains("crit-shell-real")) return;
  if (document.getElementById("critscroll")) return;
  var wrap = document.querySelector(".wrap");
  var nav = document.querySelector(".topnav");
  if (!wrap || !nav) return;
  document.body.insertBefore(nav, document.body.firstChild);
  var sc = document.createElement("div");
  sc.id = "critscroll";
  wrap.parentNode.insertBefore(sc, wrap);
  sc.appendChild(wrap);
  /* 두 번째 헤더(툴바)는 스크롤 밖 고정 줄로 - 스크롤바가 툴바를 침범하지 않게 */
  var tb0 = wrap.querySelector(".toolbar");
  if (tb0) {
    var bar0 = document.createElement("div");
    bar0.className = wrap.className;
    bar0.classList.add("crit-fixedbar");
    document.body.insertBefore(bar0, sc);
    bar0.appendChild(tb0);
  }
  /* 로그/메모장처럼 내부가 100vh 플렉스인 페이지는 스크롤 영역을 꽉 채우도록 */
  if (getComputedStyle(wrap).display === "flex") wrap.style.height = "100%";
})();
</script>
<!-- crit-share: 공유 설정(카테고리/세없날 일정)을 저장해 전체 업데이트 게시에 반영 -->
<script>
(function () {
  var KEY = "crit-schedule-share";
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } }
  /* 공유 설정 모달이 열릴 때 저장값 프리필 + 미리보기 확정 시 저장 */
  var mo = new MutationObserver(function () {
    var ov = document.querySelector(".overlay");
    if (!ov || !ov.querySelector("input[data-share]") || ov.dataset.critShare) return;
    ov.dataset.critShare = "1";
    var saved = load();
    if (saved) {
      ov.querySelectorAll("input[data-share]").forEach(function (i) {
        i.checked = saved.share.indexOf(i.dataset.share) !== -1;
      });
      var ns = ov.querySelector("#sh-nosess");
      if (ns) ns.checked = !!saved.noSess;
    }
    var ok = ov.querySelector("#so");
    if (ok) ok.addEventListener("click", function () {
      var share = Array.prototype.map.call(ov.querySelectorAll("input[data-share]:checked"), function (i) { return i.dataset.share; });
      var ns2 = ov.querySelector("#sh-nosess");
      try { localStorage.setItem(KEY, JSON.stringify({ share: share, noSess: ns2 ? ns2.checked : false })); } catch (e) {}
    }, true);
  });
  mo.observe(document.body, { childList: true });
  /* 게시기: 저장된 공유 설정을 캘린더 필터에 적용 */
  window.critApplyShare = function () {
    var saved = load();
    if (!saved) return;
    document.querySelectorAll("#catbar input[data-cat]").forEach(function (i) {
      var want = saved.share.indexOf(i.dataset.cat) !== -1;
      if (i.checked !== want) { i.checked = want; i.dispatchEvent(new Event("change", { bubbles: true })); }
    });
  };
})();
</script>
<!-- crit-schedule-update: 업데이트 = 게시할 카테고리 확인(저장) 후 게시. 저장값은 전체 업데이트에도 적용 -->
<script>
(function () {

<!-- crit-modal-dragguard: 모달 안에서 드래그를 시작해 바깥에서 놓아도 모달이 닫히지 않게 (전체 모달 공통) -->
<script>
(function () {
  var downTarget = null;
  document.addEventListener("pointerdown", function (e) { downTarget = e.target; }, true);
  document.addEventListener("click", function (e) {
    var t = e.target;
    if (!t || !t.classList || !t.classList.contains("overlay")) return;
    /* 클릭이 오버레이(배경)에서 시작되지 않았다면 = 모달 내부에서 드래그 시작 → 닫힘 차단 */
    if (downTarget !== t) {
      e.stopImmediatePropagation();
      e.preventDefault();
    }
  }, true);
})();
</script>
<!-- crit-schedule-persist: 카테고리/일정/세없날 실제 저장·복원 + 위젯과 실시간 동기화 -->
<script>
(function () {
  var KEY = "crit-schedule-store";
  function loadStore() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
  function applyStore(st) {
    if (!st) return false;
    if (Array.isArray(st.cats) && st.cats.length) { cats.length = 0; st.cats.forEach(function (c) { cats.push(c); }); }
    if (Array.isArray(st.schedules)) { schedules.length = 0; st.schedules.forEach(function (x) { schedules.push(x); }); }
    if (Array.isArray(st.noSess)) { noSess.clear(); st.noSess.forEach(function (d) { noSess.add(d); }); }
    return true;
  }
  var st = window.CRIT_SCHED_PUB ? window.CRIT_SCHED_PUB.store : loadStore();
  if (st) applyStore(st);
  else if ((localStorage.getItem("crit-fresh") === "1" || localStorage.getItem("crit-onboarded") !== "1")) { schedules.length = 0; noSess.clear(); }
  try {
    var mx = 0;
    schedules.forEach(function (x) { var m = /^[sn]?(\d+)$/.exec(String(x.id)); if (m) mx = Math.max(mx, parseInt(m[1], 10)); });
    if (typeof seq !== "undefined" && mx >= seq) seq = mx + 1;
  } catch (e) {}
  /* 위젯 창과 이 창이 동시에 열려 있으면 각자 독립적으로 seq를 증가시켜 새 일정 id가
     우연히 같아질 수 있었다(실제 겪은 버그: 서로 다른 날짜의 일정 두세 개가 같은 id를
     공유 - 그 중 하나만 지워도 삭제가 id 기준으로 동작해서 나머지도 같이 사라졌음).
     불러올 때마다 겹치는 id가 있는지 검사해서, 겹치면 뒤쪽 것만 새 id로 갈아끼워
     데이터는 그대로 두고 충돌만 풀어준다 */
  var dupFixed = false;
  try {
    var seenIds = {};
    schedules.forEach(function (x) {
      if (seenIds[x.id]) {
        do { x.id = 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); } while (seenIds[x.id]);
        dupFixed = true;
      }
      seenIds[x.id] = true;
    });
  } catch (e) {}
  var _sv = save;
  save = function () {
    _sv();
    if (window.CRIT_SCHED_PUB) return; /* 게시본은 저장 안 함 */
    try { localStorage.setItem(KEY, JSON.stringify({ cats: cats, schedules: schedules, noSess: Array.from(noSess) })); }
    catch (e) { console.warn("crit-schedule-persist 저장 실패", e); }
  };
  function rerender() {
    if (typeof renderCats === "function") renderCats();
    if (typeof renderCatRows === "function") renderCatRows();
    if (typeof renderCal === "function") renderCal();
    if (typeof renderDay === "function") renderDay();
    if (typeof renderMobile === "function") renderMobile();
  }
  if (dupFixed && !window.CRIT_SCHED_PUB) save();
  rerender();
  /* 위젯에서 바꾼 일정/세없날 실시간 반영 */
  function resync() { if (window.CRIT_SCHED_PUB) return; applyStore(loadStore()); rerender(); }
  window.addEventListener("storage", function (e) { if (e.key === KEY) resync(); });
  /* 설치판(file://)은 창 간 storage 이벤트가 안 올 수 있어 폴링 폴백 */
  var lastRaw = localStorage.getItem(KEY);
  var _svP = save;
  save = function () { _svP(); lastRaw = localStorage.getItem(KEY); };
  setInterval(function () {
    var raw = localStorage.getItem(KEY);
    if (raw !== lastRaw) { lastRaw = raw; resync(); }
  }, 1500);
})();
</script>
<!-- crit-fancy-select: 모달 셀렉트를 테마 드롭다운으로 교체 -->
<style>
  .mrow { position: relative; }
  .fsel { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px;
    color: var(--text); font-size: 13px; font-family: inherit; cursor: pointer; text-align: left; }
  .fsel::after { content: "▾"; font-size: 10px; color: var(--dim); }
  .fsel:hover, .fsel.open { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .fmenu { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 60;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px;
    box-shadow: 0 10px 30px #0007; max-height: 240px; overflow-y: auto; }
  .fitem { padding: 7px 11px; border-radius: 7px; font-size: 13px; color: var(--text); cursor: pointer;
    display: flex; align-items: center; gap: 8px; }
  .fitem:hover { background: color-mix(in srgb, var(--accent) 20%, var(--panel2)); }
  .fitem.on { color: color-mix(in srgb, var(--accent) 65%, var(--text)); font-weight: 700; }
  .fitem .fdot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
</style>
<script>
(function () {
  function dotColor(val) {
    try {
      var c = (typeof cats !== "undefined") && cats.find ? cats.find(function (x) { return x.key === val; }) : null;
      return c ? c.color : null;
    } catch (e) { return null; }
  }
  function fancify(sel) {
    if (sel.dataset.fancy) return;
    sel.dataset.fancy = "1";
    sel.style.display = "none";
    var btn = document.createElement("button");
    btn.type = "button"; btn.className = "fsel";
    function label() {
      var o = sel.selectedOptions[0];
      btn.innerHTML = "";
      if (o) {
        var col = dotColor(o.value);
        if (col) { var d = document.createElement("span"); d.className = "fdot"; d.style.background = col; btn.appendChild(d); }
        btn.appendChild(document.createTextNode(o.textContent));
      }
    }
    label();
    sel.parentNode.insertBefore(btn, sel);
    var menu = null;
    function close() { if (menu) { menu.remove(); menu = null; btn.classList.remove("open"); } }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (menu) { close(); return; }
      menu = document.createElement("div");
      menu.className = "fmenu";
      Array.prototype.forEach.call(sel.options, function (o) {
        var it = document.createElement("div");
        it.className = "fitem" + (o.selected ? " on" : "");
        var col = dotColor(o.value);
        if (col) { var d = document.createElement("span"); d.className = "fdot"; d.style.background = col; it.appendChild(d); }
        it.appendChild(document.createTextNode(o.textContent));
        it.addEventListener("click", function () {
          sel.value = o.value;
          sel.dispatchEvent(new Event("change", { bubbles: true }));
          label(); close();
        });
        menu.appendChild(it);
      });
      btn.parentNode.appendChild(menu);
      btn.classList.add("open");
    });
    document.addEventListener("click", close);
  }
  function scan(root) { root.querySelectorAll("select").forEach(fancify); }
  new MutationObserver(function (ms) {
    ms.forEach(function (m) {
      Array.prototype.forEach.call(m.addedNodes, function (n) {
        if (n.nodeType === 1 && n.classList && n.classList.contains("overlay")) scan(n);
      });
    });
  }).observe(document.body, { childList: true });
})();
</script>
<!-- crit-close-modal: X 버튼 → 트레이 최소화/완전 종료 선택 (기억하기) -->
<script>
(function () {
  function showCloseModal() {
    if (document.getElementById("crit-close-ov")) return;
    var ov = document.createElement("div");
    ov.className = "overlay"; ov.id = "crit-close-ov";
    ov.innerHTML = '<div class="modal"><h3>창 닫기</h3>' +
      '<div class="hint" style="margin:0 0 12px">Crit을 어떻게 할까요? 트레이로 최소화하면 위젯과 알림은 계속 동작해요.</div>' +
      '<label style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim);cursor:pointer;margin:0 0 12px">' +
      '<input type="checkbox" id="cc-rem"> 선택 기억하기 (환경설정에서 변경 가능)</label>' +
      '<div class="mbtns"><button id="cc-tray" class="critkeep">트레이로 최소화</button>' +
      '<button class="primary critkeep" id="cc-quit">완전 종료</button></div></div>';
    document.body.appendChild(ov);
    ov.addEventListener("click", function (e) { if (e.target === ov) ov.remove(); });
    function go(choice) {
      var rem = ov.querySelector("#cc-rem").checked;
      ov.remove();
      if (window.api && window.api.app && window.api.app.closeChoice) window.api.app.closeChoice(choice, rem);
    }
    ov.querySelector("#cc-tray").addEventListener("click", function () { go("tray"); });
    ov.querySelector("#cc-quit").addEventListener("click", function () { go("quit"); });
  }
  if (window.api && window.api.app && window.api.app.onCloseRequest) {
    window.api.app.onCloseRequest(function () {
      if (window.api.app.closeAskShown) window.api.app.closeAskShown();
      showCloseModal();
    });
  }
  /* app-shell.html에 감싸여 있으면 IPC가 최상위 프레임(shell)에만 도착하므로,
     shell이 postMessage로 중계해준 이벤트도 받아서 동일하게 모달을 띄운다 */
  window.addEventListener("message", function (e) {
    if (e && e.data && e.data.crit === "close-request") showCloseModal();
  });
})();
</script>
<!-- crit-fancy-all: 앱의 모든 셀렉트를 테마 드롭다운으로 (동적 생성/표시 전환 포함) -->
<style>
  .fwrap { position: relative; flex: 1; display: flex; min-width: 0; }
  .fwrap .fsel { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px;
    color: var(--text); font-size: 13px; font-family: inherit; cursor: pointer; text-align: left; min-width: 0; }
  .fwrap .fsel { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fwrap .fsel::after { content: "▾"; font-size: 10px; color: var(--dim); flex: none; }
  .fwrap .fsel:hover, .fwrap .fsel.open { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .fwrap .fmenu { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 80;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px;
    box-shadow: 0 10px 30px #0007; max-height: 240px; overflow-y: auto; }
  .fwrap .fitem { padding: 7px 11px; border-radius: 7px; font-size: 13px; color: var(--text); cursor: pointer;
    display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fwrap .fitem:hover { background: color-mix(in srgb, var(--accent) 20%, var(--panel2)); }
  .fwrap .fitem.on { color: color-mix(in srgb, var(--accent) 65%, var(--text)); font-weight: 700; }
  .fwrap .fdot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
</style>
<script>
(function () {
  function dotColor(val) {
    try {
      var c = (typeof cats !== "undefined") && cats.find ? cats.find(function (x) { return x.key === val; }) : null;
      return c ? c.color : null;
    } catch (e) { return null; }
  }
  function visible(sel) { return sel.style.display !== "none"; }
  function fancify(sel) {
    if (sel.dataset.fancy) return;
    sel.dataset.fancy = "1";
    var wrap = document.createElement("span");
    wrap.className = "fwrap";
    sel.parentNode.insertBefore(wrap, sel);
    wrap.appendChild(sel);
    var wasHidden = !visible(sel);
    sel.style.display = "none";
    var btn = document.createElement("button");
    btn.type = "button"; btn.className = "fsel"; /* critkeep 없음: 게시본에서는 버튼 숨김 규칙으로 자동 제거 */
    if (wasHidden) wrap.style.display = "none";
    function label() {
      var o = sel.selectedOptions[0];
      btn.innerHTML = "";
      if (o) {
        var col = dotColor(o.value);
        if (col) { var d = document.createElement("span"); d.className = "fdot"; d.style.background = col; btn.appendChild(d); }
        btn.appendChild(document.createTextNode(o.textContent));
      } else btn.appendChild(document.createTextNode("선택"));
    }
    label();
    wrap.appendChild(btn);
    var menu = null;
    function close() { if (menu) { menu.remove(); menu = null; btn.classList.remove("open"); } }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (menu) { close(); return; }
      menu = document.createElement("div");
      menu.className = "fmenu";
      Array.prototype.forEach.call(sel.options, function (o) {
        var it = document.createElement("div");
        it.className = "fitem" + (o.selected ? " on" : "");
        var col = dotColor(o.value);
        if (col) { var d = document.createElement("span"); d.className = "fdot"; d.style.background = col; it.appendChild(d); }
        it.appendChild(document.createTextNode(o.textContent));
        it.addEventListener("click", function (e2) {
          e2.stopPropagation();
          sel.value = o.value;
          sel.dispatchEvent(new Event("change", { bubbles: true }));
          sel.dispatchEvent(new Event("input", { bubbles: true }));
          label(); close();
        });
        menu.appendChild(it);
      });
      wrap.appendChild(menu);
      btn.classList.add("open");
    });
    document.addEventListener("click", close);
    /* select의 표시/값이 바뀌면 버튼도 동기화 (예: 온보딩 모니터 선택 표시 전환) */
    var reHiding = false;
    new MutationObserver(function () {
      if (reHiding) { reHiding = false; return; }
      if (visible(sel)) {
        /* 외부 코드가 select를 다시 보이게 함(예: 온보딩) → 래퍼만 보이고 원본은 계속 숨김 */
        wrap.style.display = "";
        reHiding = true;
        sel.style.display = "none";
        label();
      } else {
        wrap.style.display = "none";
      }
    }).observe(sel, { attributes: true, attributeFilter: ["style", "class"] });
    sel.addEventListener("change", label);
    /* 옵션이 뒤늦게 채워지는 경우(모니터 목록 등) 라벨 갱신 */
    new MutationObserver(label).observe(sel, { childList: true });
  }
  function scan(root) {
    if (!root.querySelectorAll) return;
    root.querySelectorAll("select:not([data-fancy])").forEach(fancify);
  }
  scan(document);
  new MutationObserver(function (ms) {
    ms.forEach(function (m) {
      Array.prototype.forEach.call(m.addedNodes, function (n) {
        if (n.nodeType === 1) { if (n.tagName === "SELECT") fancify(n); else scan(n); }
      });
    });
  }).observe(document.body, { childList: true, subtree: true });
})();
</script>
<!-- crit-extlink: 외부 링크는 항상 기본 브라우저로 (프로토콜 없는 주소 보정 포함) -->
<script>
document.addEventListener("click", function (e) {
  var a = e.target.closest ? e.target.closest("a[href]") : null;
  if (!a) return;
  var raw = a.getAttribute("href") || "";
  if (/^(#|javascript:|mailto:)/i.test(raw)) return;
  var isAbs = /^https?:\/\//i.test(raw);
  var domainish = /^[\w-]+(\.[\w-]+)+([\/?#]|$)/.test(raw) && raw.indexOf(".html") === -1;
  if (!isAbs && !domainish) return; /* 내부 페이지 이동은 그대로 */
  e.preventDefault();
  e.stopPropagation();
  var u = isAbs ? raw : "https://" + raw;
  if (window.api && window.api.app && window.api.app.openExternal) window.api.app.openExternal(u);
  else window.open(u, "_blank", "noopener");
}, true);
</script>
